[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-citations"
version = "0.1.0"
description = "Hybrid-search PDF RAG with page citations, reranking and grounding."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.40",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pypdf[crypto]>=5.0",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "langchain-ollama>=0.2",
  "sentence-transformers>=3.0",
  "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = [".", "tests", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
