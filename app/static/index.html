<!doctype html><html><head><meta charset="utf-8"><title>RAG Console</title><style>body{font:15px system-ui;background:#0d1117;color:#e6edf3;margin:0}.wrap{max-width:1100px;margin:auto;padding:42px}.grid{display:grid;grid-template-columns:320px 1fr;gap:20px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:22px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #30363d;background:#0d1117;color:#fff;margin-top:10px}button{background:#238636;font-weight:700;cursor:pointer}.answer{min-height:220px;white-space:pre-wrap}.pill{display:inline-block;background:#1f6feb33;border:1px solid #1f6feb;padding:5px 9px;border-radius:20px;margin:4px}small{color:#8b949e}</style></head><body><div class="wrap"><h1>Production RAG Console</h1><p><small>Hybrid retrieval · cross-encoder reranking · grounded page citations</small></p><div class="grid"><div class="card"><h3>Knowledge base</h3><input id="pdf" type="file" accept=".pdf"><button onclick="ingest()">Ingest PDF</button><p id="ingest"></p></div><div class="card"><h3>Ask your documents</h3><input id="q" placeholder="What are the main risks discussed?"><button onclick="ask()">Ask</button><h3>Grounded answer</h3><div id="a" class="answer">Ready.</div><div id="sources"></div></div></div></div><script>async function ingest(){let f=pdf.files[0];if(!f)return;let d=new FormData();d.append('file',f);ingest.innerText='';document.getElementById('ingest').innerText='Indexing…';let r=await fetch('/ingest',{method:'POST',body:d});document.getElementById('ingest').innerText=r.ok?'Indexed successfully':'Ingest failed'}async function ask(){a.innerText='Retrieving and grounding…';sources.innerHTML='';let r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});let d=await r.json();a.innerText=d.answer||d.detail;sources.innerHTML=(d.sources||[]).map(s=>'<span class="pill">p.'+s.page+' · '+s.source+'</span>').join('')}</script></body></html>
