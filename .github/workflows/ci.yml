name: production-rag-ci

on:
  push:
    paths:
      - "**"
      - ".github/workflows/production-rag-ci.yml"
  pull_request:
    paths:
      - "**"
      - ".github/workflows/production-rag-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
